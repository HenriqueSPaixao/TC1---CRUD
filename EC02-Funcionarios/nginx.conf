server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Garante que acentos apareçam corretamente no HTML e no JavaScript
    charset utf-8;

    # Desenvolvimento: o navegador sempre confere se há uma versão nova dos arquivos
    add_header Cache-Control "no-cache";
}
